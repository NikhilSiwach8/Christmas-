<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Fonts are bundled locally (SIL OFL: Nunito Sans + Uncial Antiqua) - no external requests -->
		<link rel="preload" href="%sveltekit.assets%/fonts/NunitoSans-Variable.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/UncialAntiqua-400.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			@font-face { font-family: 'Nunito Sans'; src: url('%sveltekit.assets%/fonts/NunitoSans-Variable.woff2') format('woff2'); font-weight: 200 1000; font-display: block; }
			@font-face { font-family: 'Uncial Antiqua'; src: url('%sveltekit.assets%/fonts/UncialAntiqua-400.woff2') format('woff2'); font-weight: 400; font-display: block; }
		</style>
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
